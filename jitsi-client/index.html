<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Meeting Assistant Jitsi Client</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #jitsi-container {
            width: 100%;
            height: 100%;
        }
    </style>

    <script src="https://192.168.10.151:8443/external_api.js"></script>
</head>

<body>

<div id="jitsi-container"></div>

<script>

    const params = new URLSearchParams(
        window.location.search
    );

    const roomName =
        params.get("room");

    const displayName =
        params.get("name") ||
        "Meeting-Minute-Bot";


    if (!roomName) {

        document.body.innerText =
            "ERROR: No room specified.";

        throw new Error(
            "Missing room parameter"
        );
    }


    console.log(
        "[CLIENT] Starting Jitsi IFrame API."
    );


    const api =
        new JitsiMeetExternalAPI(
            "192.168.10.151:8443",
            {
                roomName: roomName,

                parentNode:
                    document.querySelector(
                        "#jitsi-container"
                    ),

                width: "100%",
                height: "100%",

                userInfo: {
                    displayName:
                        displayName
                },

                configOverwrite: {
                    prejoinConfig: {
                        enabled: false
                    },

                    disableAP: true,

                    startWithAudioMuted: true,
                    startWithVideoMuted: true
                },

                interfaceConfigOverwrite: {
                    TOOLBAR_BUTTONS: []
                }
            }
        );


    window.jitsiApi =
        api;


    console.log(
        "[CLIENT] Jitsi API created."
    );


    api.addListener(
        "videoConferenceJoined",
        function (event) {

            console.log(
                "[CLIENT] Conference joined.",
                event
            );

            window.dispatchEvent(
                new Event(
                    "jitsi-joined"
                )
            );
        }
    );


    api.addListener(
        "participantJoined",
        function (participant) {

            console.log(
                "[CLIENT] Participant joined:",
                JSON.stringify(
                    participant
                )
            );

            window.dispatchEvent(
                new Event(
                    "participants-changed"
                )
            );
        }
    );


    api.addListener(
        "participantLeft",
        function (participant) {

            console.log(
                "[CLIENT] Participant left:",
                JSON.stringify(
                    participant
                )
            );

            window.dispatchEvent(
                new Event(
                    "participants-changed"
                )
            );
        }
    );


    api.addListener(
        "audioMuteStatusChanged",
        function (event) {

            console.log(
                "[CLIENT] Audio status changed:",
                JSON.stringify(
                    event
                )
            );
        }
    );


    api.addListener(
        "videoMuteStatusChanged",
        function (event) {

            console.log(
                "[CLIENT] Video status changed:",
                JSON.stringify(
                    event
                )
            );
        }
    );


    window.getJitsiParticipants =
        async function () {

            try {

                const rooms =
                    await api.getRoomsInfo(
                        true
                    );

                console.log(
                    "[CLIENT] getRoomsInfo:",
                    JSON.stringify(
                        rooms
                    )
                );

                return rooms;

            } catch (error) {

                console.error(
                    "[CLIENT] getRoomsInfo failed:",
                    error
                );

                return {
                    rooms: []
                };
            }
        };


    window.getParticipantCount =
        function () {

            try {

                return api.getNumberOfParticipants();

            } catch (error) {

                console.error(
                    "[CLIENT] getNumberOfParticipants failed:",
                    error
                );

                return 0;
            }
        };


    window.getSessionId =
        async function () {

            try {

                return await api.getSessionId();

            } catch (error) {

                console.error(
                    "[CLIENT] getSessionId failed:",
                    error
                );

                return "";
            }
        };


    console.log(
        "[CLIENT] API helper functions ready."
    );

</script>

</body>
</html>
